<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Demo Store</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script type="text/javascript" src="js/functions.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
</head>
<body>
  <header>
    <h1>Demo Store (Prototype)</h1>
    <nav>
      <form action="#">
        <div class="menu" onclick="toggleMenu(this)">
          <div class="menuBar1"></div>
          <div class="menuBar2"></div>
          <div class="menuBar3"></div>
        </div>
      </form>
    </nav>
  </header>
  <div id="sideMenu" class="sideMenu">
    <a href="index.html">Home</a>
    <a href="about-us.html">About</a>
  <section class="products">
    <div class="grid">
      <div class="card">
        <h3>Black Hoodie</h3>
        <p><img src="Images/hoodie.jpeg" alt="Stock image of a black hoodie"></p>
        <button onclick="alert('Add to cart (demo)')">Add</button>
      </div>
      <div class="card">
        <h3>Blue Jeans</h3>
        <p><img src="Images/jeans.jpeg" alt="Stock image of blue jeans"></p>
        <button onclick="alert('Add to cart (demo)')">Add</button>
      </div>
      <div class="card">
        <h3>Red Shirt</h3>
        <p><img src="Images/shirt.jpeg" alt="Stock image of a red shirt"></p>
        <button onclick="alert('Add to cart (demo)')">Add</button>
      </div>
    </div>
  </section>
</body>
</html>
